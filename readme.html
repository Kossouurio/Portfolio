<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Ilan KONAN</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .readme-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 40px 80px;
            min-height: 100vh;
        }

        .readme-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .readme-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 15px;
        }

        .readme-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .readme-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .readme-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .readme-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
        }

        .readme-content h1,
        .readme-content h2,
        .readme-content h3,
        .readme-content h4 {
            color: var(--primary-color);
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .readme-content h1:first-child,
        .readme-content h2:first-child {
            margin-top: 0;
        }

        .readme-content h1 { font-size: 2rem; }
        .readme-content h2 { font-size: 1.6rem; }
        .readme-content h3 { font-size: 1.3rem; }
        .readme-content h4 { font-size: 1.1rem; }

        .readme-content p {
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .readme-content a {
            color: var(--primary-color);
            text-decoration: underline;
            transition: var(--transition);
        }

        .readme-content a:hover {
            color: var(--secondary-color);
        }

        .readme-content code {
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }

        .readme-content pre {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            margin: 20px 0;
        }

        .readme-content pre code {
            background: none;
            padding: 0;
            color: var(--text-white);
        }

        .readme-content ul,
        .readme-content ol {
            color: var(--text-muted);
            margin: 15px 0;
            padding-left: 25px;
        }

        .readme-content li {
            margin-bottom: 8px;
            line-height: 1.7;
        }

        .readme-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 20px;
            margin: 20px 0;
            color: var(--text-muted);
            font-style: italic;
        }

        .readme-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 20px 0;
        }

        .readme-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .readme-content th,
        .readme-content td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .readme-content th {
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-color);
        }

        .readme-content td {
            color: var(--text-muted);
        }

        .readme-content hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 30px 0;
        }

        .loading {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 215, 0, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 60px 0;
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .readme-container {
                padding: 100px 20px 60px;
            }

            .readme-content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-logo">IK</a>
            <ul class="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="readme-container">
        <div id="readme-header" class="readme-header">
            <a href="index.html#projects" class="back-link">← Back to Projects</a>
            <h1 id="project-title" class="readme-title">Loading...</h1>
            <div id="readme-meta" class="readme-meta"></div>
            <div id="readme-buttons" class="readme-buttons"></div>
        </div>

        <div id="readme-content" class="readme-content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading README...</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Ilan KONAN. Crafted with passion & code.</p>
        </div>
    </footer>

    <script>
        const defaultGitHubUsername = 'Kossouurio';

        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const repoName = urlParams.get('repo');
            const repoOwner = urlParams.get('owner') || defaultGitHubUsername;

            if (!repoName) {
                showError('No project specified');
                return;
            }

            try {
                // Fetch repo details
                const repoResponse = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}`);
                if (!repoResponse.ok) throw new Error('Repository not found');
                const repo = await repoResponse.json();

                // Update header
                document.getElementById('project-title').textContent = repo.name;
                document.title = `${repo.name} - Ilan KONAN`;

                // Update meta info
                const metaContainer = document.getElementById('readme-meta');
                metaContainer.innerHTML = `
                    ${repo.language ? `<span class="readme-meta-item">💻 ${repo.language}</span>` : ''}
                    <span class="readme-meta-item">⭐ ${repo.stargazers_count} stars</span>
                    <span class="readme-meta-item">🍴 ${repo.forks_count} forks</span>
                    ${repo.license ? `<span class="readme-meta-item">📄 ${repo.license.name}</span>` : ''}
                `;

                // Update buttons
                const buttonsContainer = document.getElementById('readme-buttons');
                buttonsContainer.innerHTML = `
                    <a href="${repo.html_url}" target="_blank" class="btn btn-primary">View on GitHub</a>
                    ${repo.homepage ? `<a href="${repo.homepage}" target="_blank" class="btn btn-outline">Live Demo</a>` : ''}
                `;

                // Fetch and render README
                const readmeResponse = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/readme`);
                if (readmeResponse.ok) {
                    const readmeData = await readmeResponse.json();
                    
                    // Decode base64 with proper UTF-8 support
                    const base64 = readmeData.content.replace(/\n/g, '');
                    const binaryString = atob(base64);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const content = new TextDecoder('utf-8').decode(bytes);
                    
                    // Configure marked options
                    marked.setOptions({
                        breaks: true,
                        gfm: true
                    });

                    document.getElementById('readme-content').innerHTML = marked.parse(content);
                } else {
                    document.getElementById('readme-content').innerHTML = `
                        <p style="text-align: center; color: var(--text-muted);">
                            ${repo.description || 'No README available for this project.'}
                        </p>
                    `;
                }

            } catch (error) {
                console.error('Error loading project:', error);
                showError('Failed to load project details');
            }
        }

        function showError(message) {
            document.getElementById('project-title').textContent = 'Error';
            document.getElementById('readme-content').innerHTML = `
                <div class="error-message">
                    <p>${message}</p>
                    <a href="index.html#projects" class="btn btn-primary" style="margin-top: 20px;">Back to Projects</a>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', loadProjectDetails);
    </script>
</body>
</html>
